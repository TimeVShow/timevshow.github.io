<html lang="zh-CN">
<head>

<title>人才招聘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0a0e1a;color:#e0e6f0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,100,255,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(0,200,255,.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(100,0,255,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:30px 20px}
header{text-align:center;padding:40px 0 30px}
header h1{font-size:2.4em;font-weight:700;background:linear-gradient(135deg,#00d4ff,#7b2fff,#00d4ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 4s linear infinite;letter-spacing:2px}
@keyframes shine{to{background-position:200% center}}
header p{margin-top:10px;color:#7a8ba8;font-size:.95em;letter-spacing:1px}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,180,255,.25),transparent);margin:20px auto 30px;max-width:500px}

/* Biz section */
.biz-section{margin-bottom:12px}
.biz-section.collapsed .biz-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.biz-section.collapsed .biz-header{padding:4px 0 4px}
.biz-header{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0 12px;cursor:pointer;user-select:none;transition:padding .35s ease}
.biz-header h2{font-size:1.05em;font-weight:600;color:#d0daf0;letter-spacing:1px;transition:opacity .35s ease}
.biz-section.collapsed .biz-header h2{opacity:.15;font-weight:400}
.biz-header .biz-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#ff8c42,#ffb347);box-shadow:0 0 8px rgba(255,140,66,.35);flex-shrink:0}
.biz-body{max-width:920px;margin:0 auto;padding:0 10px 10px;max-height:600px;opacity:1;overflow:hidden;transition:max-height .4s ease,opacity .3s ease,padding .35s ease}
.biz-entry{display:flex;align-items:flex-start;gap:20px;margin-bottom:16px;padding:14px 18px;border-left:3px solid rgba(255,140,66,.25);background:rgba(255,140,66,.04);border-radius:0 8px 8px 0}
.biz-entry:last-child{margin-bottom:0}
.biz-entry .biz-left{flex:0 0 180px;min-width:0}
.biz-entry .biz-right{flex:1;min-width:0}
.biz-entry .biz-leader{font-size:.92em;font-weight:600;color:#e0e6f2;display:block}
.biz-entry .biz-role{font-size:.74em;color:#5a7a9a;display:block;margin-top:3px}
.biz-entry .biz-link{display:inline-block;font-size:.82em;color:#00b4ff;text-decoration:none;margin-top:8px;transition:color .2s;line-height:1.6}
.biz-entry .biz-link:hover{color:#4ad4ff;text-decoration:underline}
.biz-entry .biz-excerpt{font-size:.82em;color:#8a9ab8;line-height:1.8}
.biz-entry .biz-excerpt b{color:#ffb347;font-weight:600}
.biz-entry .biz-excerpt p{margin-bottom:3px}

/* Toggle switch */
.toggle-bar{display:flex;justify-content:center;margin-bottom:28px}
.toggle-group{display:flex;border:1px solid rgba(0,180,255,.15);border-radius:10px;overflow:hidden;background:rgba(10,15,30,.5)}
.toggle-btn{padding:10px 28px;font-size:.88em;font-weight:500;color:#5a7a9a;cursor:pointer;user-select:none;transition:all .3s;border:none;background:transparent;position:relative}
.toggle-btn:hover{color:#a0b8d8}
.toggle-btn.active{color:#fff;background:rgba(0,140,255,.15);box-shadow:inset 0 0 20px rgba(0,140,255,.08)}
.toggle-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,#00d4ff,transparent);border-radius:1px}

/* Parent row */
.parent-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;transition:all .5s ease}
.parent-row.expanded{gap:12px}

/* Parent card */
.p-card{width:180px;padding:22px 16px;border:1px solid rgba(0,180,255,.12);border-radius:14px;background:rgba(15,20,40,.65);backdrop-filter:blur(8px);cursor:pointer;user-select:none;transition:all .4s ease;text-align:center;position:relative}
.p-card:hover{border-color:rgba(0,180,255,.35);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,140,255,.1)}
.p-card.active{border-color:rgba(0,200,255,.5);background:rgba(10,25,55,.85);box-shadow:0 0 30px rgba(0,160,255,.12);transform:scale(1.08)}
.p-card.dim{opacity:.35;filter:blur(1px)}
.p-card.dim:hover{opacity:.6;filter:blur(0);transform:translateY(-3px)}
.p-card .icon{width:40px;height:40px;margin:0 auto 12px;border-radius:10px;background:linear-gradient(135deg,rgba(0,160,255,.15),rgba(120,40,255,.15));display:flex;align-items:center;justify-content:center;font-size:1.3em;transition:all .3s}
.p-card.active .icon{background:linear-gradient(135deg,rgba(0,180,255,.25),rgba(120,40,255,.25));box-shadow:0 0 15px rgba(0,160,255,.2)}
.p-card .name{font-size:.95em;font-weight:600;color:#fff;line-height:1.4}
.p-card .count{font-size:.75em;color:#5a7a9a;margin-top:6px}
.p-card .role{font-size:.75em;color:#00b4ff;margin-top:6px}

/* Child panel */
.child-panel{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease;margin:20px auto 0}
.child-panel.show{max-height:5000px;opacity:1}
.child-scroll{padding:10px 0 10px}
.child-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:0 20px}

/* AI notice banner */
.ai-notice{max-width:600px;margin:0 auto 14px;padding:10px 18px;border:1px solid rgba(255,60,60,.3);border-radius:8px;background:rgba(255,40,40,.08);color:#ff6b6b;font-size:.82em;font-weight:500;text-align:center;line-height:1.6;display:flex;align-items:center;justify-content:center;gap:8px}
.ai-notice .notice-icon{font-size:1.1em;flex-shrink:0}

/* Child card - compact selector */
.c-card{width:180px;padding:14px 16px;border:1px solid rgba(0,180,255,.08);border-radius:10px;background:rgba(12,18,38,.6);backdrop-filter:blur(6px);cursor:pointer;user-select:none;transition:all .3s;flex-shrink:0;display:flex;align-items:center;gap:10px}
.c-card:hover{border-color:rgba(0,180,255,.25);background:rgba(15,25,50,.7)}
.c-card.selected{border-color:rgba(0,200,255,.4);background:rgba(10,25,55,.8);box-shadow:0 0 16px rgba(0,160,255,.08)}
.c-card .c-dot{width:6px;height:6px;border-radius:50%;background:#00b4ff;box-shadow:0 0 6px rgba(0,180,255,.5);flex-shrink:0}
.c-card .c-name{font-size:.85em;font-weight:600;color:#d0daf0;flex:1}
.c-card .c-arrow{width:14px;height:14px;transition:transform .3s;flex-shrink:0;opacity:.4}
.c-card .c-arrow svg{fill:#4a9eff;width:14px;height:14px}
.c-card.selected .c-arrow{transform:rotate(90deg);opacity:1}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-bg{position:absolute;inset:0;background:rgba(8,12,24,.35);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.modal-card{position:relative;z-index:1;width:90%;max-width:680px;max-height:78vh;border:1px solid rgba(0,180,255,.15);border-radius:18px;background:rgba(14,20,42,.94);padding:36px 40px;overflow-y:auto;box-shadow:0 4px 80px rgba(0,80,200,.1),0 0 1px rgba(0,180,255,.2);transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.22,1,.36,1);scrollbar-width:thin;scrollbar-color:rgba(0,140,255,.15) transparent}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1)}
.modal-card::-webkit-scrollbar{width:5px}
.modal-card::-webkit-scrollbar-thumb{background:rgba(0,140,255,.2);border-radius:3px}
.modal-close{position:absolute;top:16px;right:18px;width:28px;height:28px;border:none;background:rgba(255,255,255,.06);border-radius:8px;color:#5a7a9a;font-size:1.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:rgba(255,255,255,.12);color:#fff}
.detail-title{font-size:1.2em;font-weight:700;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.detail-title .dt-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#7b2fff);box-shadow:0 0 8px rgba(0,180,255,.4)}
.detail-parent-tag{font-size:.8em;color:#4a6080;margin-bottom:20px;padding-left:18px}
.detail-desc{color:#9aacca;font-size:.9em;line-height:2;margin-bottom:24px}
.detail-desc .item{display:block;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.detail-desc .item:last-child{border-bottom:none}
.apply-btn{display:inline-block;padding:11px 36px;border:1px solid rgba(0,180,255,.35);border-radius:8px;color:#00d4ff;text-decoration:none;font-size:.88em;font-weight:500;transition:all .3s;background:rgba(0,180,255,.06)}
.apply-btn:hover{background:rgba(0,180,255,.15);border-color:#00d4ff;box-shadow:0 0 20px rgba(0,180,255,.15)}

footer{text-align:center;padding:40px 0 25px;color:#2a3550;font-size:.8em}
@media(max-width:768px){.p-card{width:140px;padding:16px 10px}.p-card .name{font-size:.82em}.c-card{width:180px}header h1{font-size:1.7em}}
</style>
</head>

let currentData=DATA_BENSHUO;

const arrowSVG='<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>';
const parentRow=document.getElementById('parentRow');
const childPanel=document.getElementById('childPanel');
const childRow=document.getElementById('childRow');
const modalOverlay=document.getElementById('modalOverlay');
const modalBg=document.getElementById('modalBg');
const modalCard=document.getElementById('modalCard');
const modalClose=document.getElementById('modalClose');
const modalBody=document.getElementById('modalBody');
let activeIdx=-1;

function renderCards(){
parentRow.innerHTML='';
closePanel();
currentData.forEach((g,i)=>{
const d=document.createElement('div');
d.className='p-card';
d.innerHTML=`<div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="count">${g.children.length} 个方向</div>`;
d.addEventListener('click',()=>toggleParent(i));
parentRow.appendChild(d);
});
}
renderCards();

document.querySelectorAll('.toggle-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
const type=btn.dataset.type;
if((type==='boshi'&&currentData===DATA_BOSHI)||(type==='benshuo'&&currentData===DATA_BENSHUO))return;
document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentData=type==='boshi'?DATA_BOSHI:DATA_BENSHUO;
bizSection.classList.add('collapsed');
renderCards();
});
});

function toggleParent(idx){
const cards=parentRow.querySelectorAll('.p-card');
if(activeIdx===idx){closePanel();return}
activeIdx=idx;
// Dim non-active cards, keep active prominent
cards.forEach((c,i)=>{
if(i===idx){c.classList.add('active');c.classList.remove('dim')}
else{c.classList.remove('active');c.classList.add('dim')}
});

// Build child selector cards
childRow.innerHTML='';
const g=currentData[idx];
g.children.forEach((c,ci)=>{
const el=document.createElement('div');
el.className='c-card';
el.innerHTML=`<span class="c-dot"></span><span class="c-name">${c.name}</span><span class="c-arrow">${arrowSVG}</span>`;
el.addEventListener('click',()=>selectChild(ci));
childRow.appendChild(el);
});
childPanel.classList.add('show');
bizSection.classList.add('collapsed');
}

function selectChild(ci){
const g=currentData[activeIdx];
const c=g.children[ci];
// Parse desc into items
const items=c.desc.split('\n').filter(s=>s.trim());
const itemsHtml=items.map(t=>`<span class="item">${t}</span>`).join('');
modalBody.innerHTML=`
${g.ai?'<div class="ai-notice"><span class="notice-icon">⚠️</span>该岗位机试内容会涉及AI内容，请认真准备</div>':''}
<div class="detail-title"><span class="dt-dot"></span>${c.name}</div>
<div class="detail-parent-tag">${g.name}</div>
<div class="detail-desc">${itemsHtml}</div>
${g.url?`<a class="apply-btn" href="${g.url}" target="_blank" rel="noopener">申请职位 →</a>`:''}`;
modalOverlay.classList.add('show');
bizSection.classList.add('collapsed');
document.body.style.overflow='hidden';
}

// --- Biz section ---
const bizBody=document.getElementById('bizBody');
const bizSection=document.getElementById('bizSection');
const bizHeader=document.getElementById('bizHeader');

function renderBizEntries(){
bizBody.innerHTML='';
DATA_SPEECHES.forEach(g=>{
const c=g.children[0];
const excerpts=c.desc.split('\n').filter(s=>s.trim()).map(t=>`<p>${t}</p>`).join('');
bizBody.innerHTML+=`
<div class="biz-entry">
<div class="biz-left">
<span class="biz-leader">${g.name}</span>
<span class="biz-role">${g.role}</span>
<a class="biz-link" href="${c.url}" target="_blank" rel="noopener">${c.name} →</a>
</div>
<div class="biz-right">
<div class="biz-excerpt">${excerpts}</div>
</div>
</div>`;
});
}
renderBizEntries();

bizHeader.addEventListener('click',()=>{
bizSection.classList.toggle('collapsed');
});

function closeModal(){
modalOverlay.classList.remove('show');
document.body.style.overflow='';
}
function closePanel(){
activeIdx=-1;
parentRow.querySelectorAll('.p-card').forEach(c=>{c.classList.remove('active','dim')});
childPanel.classList.remove('show');
closeModal();
setTimeout(()=>{childRow.innerHTML='';modalBody.innerHTML=''},400);
}

modalBg.addEventListener('click',closeModal);
modalClose.addEventListener('click',closeModal);
modalCard.addEventListener('click',e=>e.stopPropagation());
</script>
</body>
</html>
